<!DOCTYPE html>
<html>
<head><title>Page1</title></head>
<body>
    <div>
        <h2 id="showEmail"></h2>
        
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email");
        if (email) {
            document.getElementById("showEmail").textContent = "สวัสดี "+email;
        }
    </script>
</body>
</html>
